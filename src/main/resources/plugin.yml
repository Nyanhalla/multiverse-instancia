name: Multiverse-Instances
version: ${project.version}
main: com.nyanhalla.multiverseinstances.MultiverseInstances
api-version: '1.20'
description: Plugin para crear instancias paralelas de mapas adventure usando la API de Multiverse 5
author: Nyanhalla
website: https://github.com/Nyanhalla/multiverse-instances

softdepend:
  - Multiverse-Core
  - WorldEdit
  - WorldGuard

commands:
  mi:
    description: Comando principal de Multiverse-Instances
    usage: /<command> <create|list|info|delete|force-reset|purge|reload|join|leave|status|team|template>
    aliases: [mvi, multiverseinstances, minstances]
  mijoin:
    description: Unirse a una instancia
    usage: /<command> <instancia>
  mileave:
    description: Salir de la instancia actual
    usage: /<command>
  mistatus:
    description: Ver progreso de win condition
    usage: /<command>
  miteam:
    description: Comandos de equipo
    usage: /<command> <create|invite|accept|leave|info>

permissions:
  mi.admin.*:
    description: Permisos de administrador
    default: op
    children:
      mi.admin.create: true
      mi.admin.delete: true
      mi.admin.list: true
      mi.admin.others: true
      mi.admin.reload: true
      mi.admin.template: true
  mi.player.*:
    description: Permisos de jugador
    default: true
    children:
      mi.player.join: true
      mi.player.create: true
      mi.player.team: true
      mi.player.queue: true
  mi.bypass.*:
    description: Permisos especiales
    default: op
    children:
      mi.bypass.limit: true
  mi.admin.queue.*:
    description: Permisos de cola admin
    default: op
    children:
      mi.admin.queue.launch: true
